name: Deploy island-hype

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-islandhype
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build (Next standalone)
        env:
          # Dummy URL: pages are force-dynamic, so the build does not hit the DB.
          DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
          NEXT_PUBLIC_MEDIA_URL: ""
          # Finished images are served from the edge. Only this — the media URL
          # above stays empty on purpose, so the optimiser keeps reading its
          # source files off local disk instead of fetching them back through
          # the CDN it is feeding.
          NEXT_PUBLIC_CDN_URL: "https://cdn.islandhypemaldives.com"
          # The real domain. This was the nip.io hostname, which getBaseUrl()
          # feeds into canonical URLs and any absolute link built from it.
          # Non-www, because that is the hostname the site is actually linked
          # and used as. Both resolve and neither redirects, so this is what
          # decides which one search engines are told is the real one.
          NEXT_PUBLIC_SITE_URL: "https://islandhypemaldives.com"
        run: npm run build

      - name: Assemble deploy bundle
        run: |
          rm -rf deploy && mkdir -p deploy/.next deploy/public
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          # `cp -r public deploy/public` nested a second copy at public/public/
          # whenever the destination already existed, which it does — the
          # standalone output brings its own public dir. Copy the contents.
          cp -r public/. deploy/public/
          rm -rf deploy/_migration deploy/docs deploy/.git

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync build to server
        run: |
          # Two of these exclusions protect server state from --delete:
          #
          #   .next/cache/  the image optimiser's resize cache. It is not in the
          #                 build, so --delete would clear it on every deploy and
          #                 the box would re-resize every photograph on the next
          #                 visit. Excluded paths are protected from deletion.
          #   public/storage  a symlink to /var/www/island-hype-media, which is
          #                 how the optimiser reaches uploaded media: it fetches
          #                 originals through Next's own static handler, not
          #                 through nginx's alias, so the tree has to be visible
          #                 under public/. The media itself is never deployed.
          rsync -az --delete \
            --exclude='ecosystem.config.cjs' --exclude='_import' \
            --exclude='.next/cache/' --exclude='public/storage' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            deploy/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/island-hype/"

      - name: Reload app (reads env from ecosystem on server)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /var/www/island-hype && pm2 startOrReload ecosystem.config.cjs && pm2 save"

      # The image cache survives a deploy (see the rsync exclusion above), but a
      # page whose hero changed still costs the FIRST visitor the resize — 1.9
      # seconds, measured, for a hero on this box. Requesting the four heroes at
      # the widths a real browser asks for moves that cost here, where nobody is
      # waiting, instead of onto whoever lands next.
      #
      # Best-effort throughout: a warm that fails must never fail a deploy that
      # has already succeeded.
      - name: Warm the hero image cache
        continue-on-error: true
        run: |
          BASE="https://www.islandhypemaldives.com"
          sleep 5
          for PAGE in / /packages /locations /accommodations; do
            curl -sS --max-time 20 "$BASE$PAGE" -o /tmp/page.html || continue
            # The srcsets the page just rendered, so this follows the images in
            # use rather than a list here that would go stale.
            grep -o '/_next/image?url=[^" ]*' /tmp/page.html \
              | sed 's/&amp;/\&/g' | sort -u | head -20 \
              | while read -r U; do
                  curl -sS --max-time 30 -o /dev/null \
                    -H 'Accept: image/webp,*/*' "$BASE$U" || true
                done
            echo "warmed $PAGE"
          done
